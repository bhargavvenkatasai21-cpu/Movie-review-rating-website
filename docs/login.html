<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Movie Review</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="toast"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h1>🎬 Movie Review</h1>
                <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" style="padding: 6px 12px; font-size: 12px;">
                    🌙 Dark
                </button>
            </div>

            <h2>Login to Your Account</h2>

            <input type="email" id="email" placeholder="Email Address" required>

            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Password" required>
                <button type="button" class="eye-btn" id="togglePasswordBtn" onclick="togglePasswordVisibility('password', 'togglePasswordBtn')" title="Show / Hide Password">👁️</button>
            </div>

            <button type="button" id="loginSubmitBtn" onclick="login()">Login</button>

            <p>
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>

    <script>
        function togglePasswordVisibility(inputId, btnId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(btnId);
            if (!input || !btn) return;
            if (input.type === "password") {
                input.type = "text";
                btn.classList.add("active");
                btn.title = "Hide Password";
            } else {
                input.type = "password";
                btn.classList.remove("active");
                btn.title = "Show Password";
            }
            btn.innerHTML = "👁️";
        }
    </script>
</body>
</html>
